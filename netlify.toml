# Un seul site Netlify pour tous les coachs.
#
#   bilan-forme.netlify.app/                     → l'annuaire interne
#   bilan-forme.netlify.app/thomas-vaysse        → sa page
#   bilan-forme.netlify.app/tristan-maffettone   → sa page
#
# Netlify sert /prenom-nom sans barre finale : aucune redirection à écrire.
# Le domaine commun se règle dans config/_defaults.json → site.base
# (il alimente les URL canoniques et les partages Open Graph).

[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# L'annuaire est une page de travail : jamais indexée.
[[headers]]
  for = "/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Si un coach doit un jour avoir son propre nom de domaine ───────────────
# Créer un second site Netlify sur le même dépôt, avec :
#   Build command     : node build.js prenom-nom
#   Publish directory : dist/prenom-nom
# et renseigner "meta": { "url": "https://son-domaine.fr/" } dans sa config
# pour que la balise canonique pointe au bon endroit.
